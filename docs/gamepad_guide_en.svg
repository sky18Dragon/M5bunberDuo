    <rect x="842" y="352" width="244" height="68" rx="12" fill="#F6F2E9" stroke="#E53935" stroke-opacity="0.55" stroke-width="1.6"/>
    <circle cx="868" cy="374" r="11" fill="#E53935"/>
    <text x="868" y="378" text-anchor="middle" font-size="12" class="tag">A</text>
    <text x="888" y="379" class="lblTitle">Primary Action</text>
    <text x="854" y="404" class="lblSub">Flash · Restore Slot · Start Monitor</text>
  </g>

  <g>
    <polyline points="707,442 707,490 818,490 842,490" fill="none" stroke="#1E9E56" stroke-width="2"/>
