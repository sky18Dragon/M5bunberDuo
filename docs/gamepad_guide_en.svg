    <rect x="842" y="456" width="244" height="68" rx="12" fill="#F6F2E9" stroke="#1E9E56" stroke-opacity="0.45" stroke-width="1.4"/>
    <circle cx="868" cy="478" r="11" fill="#1E9E56"/>
    <text x="868" y="482" text-anchor="middle" font-size="12" class="tag">Y</text>
    <text x="888" y="483" class="lblTitle">Utility Action</text>
    <text x="854" y="508" class="lblSub">Scan USB-C OTG · Clear Serial Log</text>
  </g>

  <g>
    <polyline points="751,466 806,466 822,584 842,584" fill="none" stroke="#C99200" stroke-width="1.8"/>
