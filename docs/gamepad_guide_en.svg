    <rect x="460" y="424" width="200" height="34" rx="7" fill="#F6F2E9"/>
    <rect x="466" y="438" width="28" height="14" rx="3" fill="#DDD6C6"/>
    <rect x="497" y="438" width="60" height="14" rx="3" fill="#2C55DC"/>
    <rect x="560" y="438" width="44" height="14" rx="3" fill="#1B9A52"/>
    <rect x="607" y="438" width="47" height="14" rx="3" fill="#1B9A52"/>
    <text x="560" y="434" text-anchor="middle" font-size="7.5" class="screenTxt" fill="#6A6374">4.5" 1280×960 Tactile Deck</text>
    <rect x="460" y="468" width="124" height="36" rx="8" fill="#1B379B"/>
    <rect x="460" y="466" width="124" height="34" rx="8" fill="#2C55DC"/>
    <text x="522" y="487" text-anchor="middle" font-size="11" class="screenTxt" fill="#FFFFFF">⚡ Flash / Restore</text>
    <rect x="590" y="468" width="70" height="36" rx="8" fill="#106836"/>
    <rect x="590" y="466" width="70" height="34" rx="8" fill="#1B9A52"/>
