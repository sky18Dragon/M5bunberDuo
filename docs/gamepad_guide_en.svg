    <circle cx="753" cy="394" r="4" fill="#2962FF"/>
    <rect x="842" y="250" width="244" height="68" rx="12" fill="#F6F2E9" stroke="#2962FF" stroke-opacity="0.45" stroke-width="1.4"/>
    <circle cx="868" cy="272" r="11" fill="#2962FF"/>
