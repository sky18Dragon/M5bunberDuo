<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 660" width="1120" height="660">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2A241A" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="hingeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D5CEC0"/>
      <stop offset="50%" stop-color="#ECE7DB"/>
      <stop offset="100%" stop-color="#C2B9A7"/>
    </linearGradient>
    <linearGradient id="ledGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E08E0B" stop-opacity="0"/>
      <stop offset="50%" stop-color="#E08E0B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E08E0B" stop-opacity="0"/>
    </linearGradient>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; fill: #211E28; }
      .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; fill: #6A6374; }
      .tag { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 800; fill: #FFFFFF; }
      .tagDark { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 800; fill: #211E28; }
      .lblTitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14.5px; font-weight: 800; fill: #211E28; }
      .lblSub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; font-weight: 500; fill: #5E5869; }
      .screenTxt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 700; }
    </style>
  </defs>

  <!-- Retro Beige Canvas Background -->
  <rect x="0" y="0" width="1120" height="660" rx="24" fill="#E9E3D5"/>
  <rect x="12" y="12" width="1096" height="636" rx="18" fill="none" stroke="#D2C9B6" stroke-width="1.5"/>

  <!-- Header -->
  <text x="560" y="48" text-anchor="middle" font-size="22" class="title">Retroid Pocket Duo · Gamepad Control Map</text>
  <text x="560" y="72" text-anchor="middle" font-size="13" class="sub">Top 5.5" Discovery Stage  ·  Bottom 4.5" Tactile Deck  ·  Full Hardware Key Dispatch</text>

  <!-- ================= RETROID POCKET DUO CLAMSHELL ILLUSTRATION ================= -->
  <g filter="url(#cardShadow)">
    <!-- Shoulder Triggers -->
    <rect x="336" y="344" width="62" height="20" rx="7" fill="#BDB5A4" stroke="#9F9786" stroke-width="1.2"/>
    <rect x="344" y="352" width="54" height="16" rx="6" fill="#CFC7B7" stroke="#AFA796" stroke-width="1.2"/>
    <rect x="722" y="344" width="62" height="20" rx="7" fill="#BDB5A4" stroke="#9F9786" stroke-width="1.2"/>
    <rect x="722" y="352" width="54" height="16" rx="6" fill="#CFC7B7" stroke="#AFA796" stroke-width="1.2"/>

    <!-- Top Clamshell Lid (5.5" 16:9) -->
    <rect x="328" y="100" width="464" height="240" rx="22" fill="#F4EFE4" stroke="#C8C0AE" stroke-width="2"/>
    <rect x="348" y="116" width="424" height="208" rx="12" fill="#17151F"/>
    <!-- Top Screen UI Mini Preview -->
    <rect x="358" y="124" width="404" height="26" rx="6" fill="#F5F1E8"/>
    <rect x="364" y="129" width="54" height="16" rx="4" fill="#DDD6C6"/>
    <circle cx="372" cy="135" r="2.2" fill="#2962FF"/><circle cx="378" cy="135" r="2.2" fill="#E53935"/>
    <circle cx="372" cy="140" r="2.2" fill="#1E9E56"/><circle cx="378" cy="140" r="2.2" fill="#F4B400"/>
    <text x="386" y="140" font-size="8.5" class="tagDark">M5 DUO</text>
    <rect x="428" y="129" width="150" height="16" rx="4" fill="#DDD6C6"/>
    <rect x="431" y="131" width="48" height="12" rx="3" fill="#FFFDF8"/>
    <text x="455" y="140" text-anchor="middle" font-size="8" class="screenTxt" fill="#211E28">Catalog</text>
    <text x="502" y="140" text-anchor="middle" font-size="8" class="screenTxt" fill="#6A6374">Vault</text>
    <text x="550" y="140" text-anchor="middle" font-size="8" class="screenTxt" fill="#6A6374">Monitor</text>
    <!-- 3 Mini Cartridge Cards -->
    <rect x="358" y="156" width="404" height="158" rx="8" fill="#E9E3D5"/>
    <rect x="368" y="168" width="120" height="134" rx="8" fill="#F6F2E9" stroke="#E08E0B" stroke-width="2.5"/>
    <rect x="376" y="182" width="104" height="72" rx="5" fill="#E8B848"/>
    <text x="428" y="274" text-anchor="middle" font-size="10" class="screenTxt" fill="#211E28">Cartridges</text>
    <text x="428" y="290" text-anchor="middle" font-size="9" class="mono" fill="#E08E0B">5.5" 1920×1080</text>
    <rect x="500" y="168" width="120" height="134" rx="8" fill="#F6F2E9" stroke="#D5CDBB" stroke-width="1"/>
    <rect x="508" y="182" width="104" height="72" rx="5" fill="#1B3B28"/>
    <text x="560" y="224" text-anchor="middle" font-size="12" class="mono" fill="#4ADE80">Launcher</text>
    <text x="560" y="274" text-anchor="middle" font-size="10" class="screenTxt" fill="#5A5464">Save Vault</text>
    <rect x="632" y="168" width="120" height="134" rx="8" fill="#F6F2E9" stroke="#D5CDBB" stroke-width="1"/>
    <rect x="640" y="182" width="104" height="72" rx="5" fill="#141B16"/>
    <text x="692" y="224" text-anchor="middle" font-size="10" class="mono" fill="#6EF2A0">CRT UART</text>
    <text x="692" y="274" text-anchor="middle" font-size="10" class="screenTxt" fill="#5A5464">Live Debug</text>
    <rect x="490" y="317" width="140" height="3" rx="1.5" fill="url(#ledGlow)"/>

    <!-- Clamshell Hinge -->
    <rect x="348" y="336" width="424" height="22" rx="11" fill="url(#hingeGrad)" stroke="#B8AF9D" stroke-width="1.2"/>

    <!-- Lower Base Shell -->
    <rect x="318" y="356" width="484" height="264" rx="26" fill="#F4EFE4" stroke="#C8C0AE" stroke-width="2"/>

