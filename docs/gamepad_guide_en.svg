    <rect x="34" y="394" width="244" height="68" rx="12" fill="#F6F2E9" stroke="#D2C9B6" stroke-width="1.2"/>
    <rect x="46" y="407" width="52" height="22" rx="6" fill="#3B3842"/>
    <text x="72" y="422" text-anchor="middle" font-size="11" class="tag">D-Pad</text>
    <text x="108" y="423" class="lblTitle">Navigate Shelf</text>
    <text x="46" y="446" class="lblSub">Browse 3-col cartridges &amp; save slots</text>
  </g>

  <g>
    <polyline points="372,584 278,584" fill="none" stroke="#8A8296" stroke-width="1.8"/>
    <circle cx="372" cy="584" r="4" fill="#5A5464"/>
    <rect x="34" y="552" width="244" height="64" rx="12" fill="#F6F2E9" stroke="#D2C9B6" stroke-width="1.2"/>
    <rect x="46" y="565" width="56" height="22" rx="6" fill="#5A5464"/>
    <text x="74" y="580" text-anchor="middle" font-size="10.5" class="tag">SELECT</text>
    <text x="110" y="581" class="lblTitle">Protocol Logs</text>
    <text x="46" y="603" class="lblSub">Toggle raw SLIP / USB log drawer</text>
  </g>

