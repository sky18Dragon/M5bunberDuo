    <rect x="842" y="148" width="244" height="68" rx="12" fill="#F6F2E9" stroke="#D2C9B6" stroke-width="1.2"/>
    <rect x="854" y="161" width="32" height="22" rx="6" fill="#2C55DC"/>
    <text x="870" y="176" text-anchor="middle" font-size="11.5" class="tag">R1</text>
    <rect x="891" y="161" width="32" height="22" rx="6" fill="#E08E0B"/>
    <text x="907" y="176" text-anchor="middle" font-size="11.5" class="tag">R2</text>
    <text x="932" y="177" class="lblTitle">Next Mode / Option</text>
    <text x="854" y="200" class="lblSub">R1 Mode · R2 Category / Scope / Baud</text>
  </g>

  <g>
