    <circle cx="739" cy="394" r="14" fill="#2962FF"/>
    <text x="739" y="399" text-anchor="middle" font-size="13" class="tag">X</text>
    <circle cx="707" cy="428" r="15" fill="#106636"/>
    <circle cx="707" cy="426" r="14" fill="#1E9E56"/>
    <text x="707" y="431" text-anchor="middle" font-size="13" class="tag">Y</text>
    <circle cx="771" cy="428" r="15" fill="#9E221E"/>
    <circle cx="771" cy="426" r="14" fill="#E53935"/>
    <text x="771" y="431" text-anchor="middle" font-size="13" class="tag">A</text>
    <circle cx="739" cy="460" r="15" fill="#B58200"/>
    <circle cx="739" cy="458" r="14" fill="#F4B400"/>
    <text x="739" y="463" text-anchor="middle" font-size="13" class="tagDark">B</text>
    <circle cx="739" cy="524" r="28" fill="#DCD5C6" stroke="#C4BCAC" stroke-width="1.5"/>
    <circle cx="739" cy="524" r="21" fill="#3B3842" stroke="#26242C" stroke-width="1.5"/>
    <circle cx="739" cy="524" r="14" fill="#4C4855"/>
    <rect x="726" y="578" width="26" height="12" rx="6" fill="#C4BCAC" stroke="#9F9786" stroke-width="1"/>
    <text x="739" y="604" text-anchor="middle" font-size="9" class="mono" fill="#7A7385">START</text>
